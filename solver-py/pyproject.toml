[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "solver-py"
version = "2.0.0"
description = "Industrial-Grade Constraint Optimization Scheduling Engine for IBP Timetable Platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "ortools>=9.9.3963",
    "numpy>=1.26.4",
    "scipy>=1.13.0",
    "scikit-learn>=1.5.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "hypothesis>=6.103.0",
    "ruff>=0.4.5",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --cov=solver_py --cov-report=term-missing"


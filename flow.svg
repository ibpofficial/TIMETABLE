<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 170" width="100%" role="img" aria-label="8 step wizard flow" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .t{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#e2e8f0;font-size:15px;font-weight:600;text-anchor:middle}
    .n{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#0b1020;font-size:18px;font-weight:800;text-anchor:middle}
    .b{animation:pop 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    @keyframes pop{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:1;transform:scale(1.1)}}
    .dash{stroke-dasharray:6 6;animation:dash 1.2s linear infinite}
    @keyframes dash{to{stroke-dashoffset:-12}}
  </style>
  <rect width="1200" height="170" rx="16" fill="#0b1020"/>
  <line class="dash" x1="75" y1="70" x2="1125" y2="70" stroke="#5b8cff" stroke-width="3"/>
  <circle class="b" cx="75" cy="70" r="24" fill="#7cf4ff" style="animation-delay:0.0s"/><text class="n" x="75" y="76">0</text><text class="t" x="75" y="120">Departments</text><text class="t" x="75" y="140">&amp; Programs</text>
  <circle class="b" cx="225" cy="70" r="24" fill="#7cf4ff" style="animation-delay:0.5s"/><text class="n" x="225" y="76">1</text><text class="t" x="225" y="120">Settings</text><text class="t" x="225" y="140">&amp; Rooms</text>
  <circle class="b" cx="375" cy="70" r="24" fill="#7cf4ff" style="animation-delay:1.0s"/><text class="n" x="375" y="76">2</text><text class="t" x="375" y="120">Batches</text>
  <circle class="b" cx="525" cy="70" r="24" fill="#7cf4ff" style="animation-delay:1.5s"/><text class="n" x="525" y="76">3</text><text class="t" x="525" y="120">Faculties</text>
  <circle class="b" cx="675" cy="70" r="24" fill="#7cf4ff" style="animation-delay:2.0s"/><text class="n" x="675" y="76">4</text><text class="t" x="675" y="120">Subjects</text>
  <circle class="b" cx="825" cy="70" r="24" fill="#7cf4ff" style="animation-delay:2.5s"/><text class="n" x="825" y="76">5</text><text class="t" x="825" y="120">Breaks &amp;</text><text class="t" x="825" y="140">Fixed Events</text>
  <circle class="b" cx="975" cy="70" r="24" fill="#a78bfa" style="animation-delay:3.0s"/><text class="n" x="975" y="76">6</text><text class="t" x="975" y="120">Constraint</text><text class="t" x="975" y="140">Solver</text>
  <circle class="b" cx="1125" cy="70" r="24" fill="#34d399" style="animation-delay:3.5s"/><text class="n" x="1125" y="76">7</text><text class="t" x="1125" y="120">Timetable</text><text class="t" x="1125" y="140">Results</text>
</svg>

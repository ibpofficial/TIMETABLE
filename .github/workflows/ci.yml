name: CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Solver Dependencies
        run: |
          if [ -d "solver-py" ]; then
            pip install -e solver-py
            pytest solver-py/tests || true
          fi

      - name: Build Packages & Apps
        run: npm run build

      - name: Run Golden Test Suite & Unit Tests
        run: npm test

      - name: Run Optimization Benchmarks
        run: npm run benchmark


<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" role="img" aria-label="IBP Timetable Generator banner" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7cf4ff"/><stop offset="1" stop-color="#5b8cff"/>
    </linearGradient>
    <style>
      .t{font-family:Inter,Segoe UI,Arial,sans-serif}
      .cell{fill:#5b8cff;opacity:.15;animation:glow 4s ease-in-out infinite}
      .c2{fill:#7cf4ff}.c3{fill:#a78bfa}
      @keyframes glow{0%,100%{opacity:.12}50%{opacity:.85}}
      @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
      .h{animation:rise 1s ease-out both}.s{animation:rise 1s .3s ease-out both}.p{animation:rise 1s .6s ease-out both}
      @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
      .grid{animation:float 6s ease-in-out infinite}
    </style>
  </defs>
  <rect width="1200" height="360" fill="url(#bg)"/>
  <g class="grid" transform="translate(760,60)">
    <g stroke="#ffffff" stroke-opacity=".12">
      <path d="M0 40H400M0 100H400M0 160H400M0 220H400M0 280H400"/>
      <path d="M0 0V280M80 0V280M160 0V280M240 0V280M320 0V280M400 0V280"/>
    </g>
    <rect class="cell" x="4" y="44" width="72" height="52" rx="8" style="animation-delay:0s"/>
    <rect class="cell c2" x="84" y="104" width="72" height="52" rx="8" style="animation-delay:.5s"/>
    <rect class="cell c3" x="164" y="44" width="72" height="52" rx="8" style="animation-delay:1s"/>
    <rect class="cell" x="244" y="164" width="72" height="52" rx="8" style="animation-delay:1.5s"/>
    <rect class="cell c2" x="324" y="104" width="72" height="52" rx="8" style="animation-delay:2s"/>
    <rect class="cell c3" x="84" y="224" width="72" height="52" rx="8" style="animation-delay:2.5s"/>
    <rect class="cell" x="164" y="164" width="72" height="52" rx="8" style="animation-delay:3s"/>
    <rect class="cell c2" x="4" y="224" width="72" height="52" rx="8" style="animation-delay:3.5s"/>
    <g class="t" fill="#cbd5e1" font-size="13" text-anchor="middle">
      <text x="40" y="26">Mon</text><text x="120" y="26">Tue</text><text x="200" y="26">Wed</text><text x="280" y="26">Thu</text><text x="360" y="26">Fri</text>
    </g>
  </g>
  <text class="t h" x="70" y="150" font-size="68" font-weight="800" fill="url(#txt)">IBP Timetable</text>
  <text class="t h" x="70" y="222" font-size="68" font-weight="800" fill="#ffffff">Generator</text>
  <text class="t s" x="72" y="268" font-size="23" fill="#cbd5e1">Smart, constraint-aware scheduling for Higher Education</text>
  <text class="t p" x="72" y="312" font-size="17" fill="#7cf4ff">React • TypeScript • CSP Solver • AI Co-Pilot • Conflict-free timetables</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="accent1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="accent2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="accent3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <style>
      .flow-line {
        stroke-dasharray: 8, 8;
        animation: flowDash 20s linear infinite;
      }
      @keyframes flowDash {
        to { stroke-dashoffset: -1000; }
      }
      .node-card {
        rx: 12px;
        fill: #1e293b;
        stroke: #334155;
        stroke-width: 1.5;
        transition: all 0.3s ease;
      }
      .title-text { font-family: 'Inter', system-ui, sans-serif; font-size: 16px; font-weight: 700; fill: #f8fafc; }
      .desc-text { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; font-weight: 400; fill: #94a3b8; }
      .badge-text { font-family: 'Fira Code', monospace; font-size: 11px; font-weight: 500; fill: #38bdf8; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="960" height="480" fill="url(#bg)" rx="16" />

  <!-- Animated Connection Paths -->
  <!-- Browser to Server -->
  <path d="M 280 200 L 380 200" stroke="#6366f1" stroke-width="2.5" class="flow-line" />
  <path d="M 380 220 L 280 220" stroke="#10b981" stroke-width="2.5" class="flow-line" />

  <!-- Server to Python Solver -->
  <path d="M 580 180 L 680 180" stroke="#38bdf8" stroke-width="2.5" class="flow-line" />
  <path d="M 680 200 L 580 200" stroke="#10b981" stroke-width="2.5" class="flow-line" />

  <!-- Server to DB & Redis -->
  <path d="M 480 300 L 480 360" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4,4" />

  <!-- Header -->
  <text x="480" y="50" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-size="22" font-weight="800" fill="#ffffff" letter-spacing="0.5">
    IBP TIMETABLE PLATFORM ARCHITECTURE
  </text>
  <text x="480" y="75" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-size="13" font-weight="400" fill="#94a3b8">
    Industrial Constraint Satisfaction &amp; Dual-Engine Optimization
  </text>

  <!-- Node 1: Browser Client -->
  <g transform="translate(60, 110)">
    <rect width="220" height="200" class="node-card" stroke="#6366f1" />
    <rect width="220" height="6" fill="url(#accent1)" rx="3" />
    <text x="20" y="38" class="title-text">Frontend Client</text>
    <text x="20" y="56" class="badge-text">React 18 + Vite</text>
    <line x1="20" y1="68" x2="200" y2="68" stroke="#334155" stroke-width="1" />
    <text x="20" y="92" class="desc-text">• 8-Step Institution Wizard</text>
    <text x="20" y="112" class="desc-text">• Web Worker TS Solver</text>
    <text x="20" y="132" class="desc-text">• Constraint Studio (30+ Rules)</text>
    <text x="20" y="152" class="desc-text">• Panoramic &amp; Heatmap Views</text>
    <text x="20" y="172" class="desc-text">• XLSX &amp; iCal (.ics) Exports</text>
  </g>

  <!-- Node 2: Node.js Orchestration Gateway -->
  <g transform="translate(370, 110)">
    <rect width="210" height="190" class="node-card" stroke="#38bdf8" />
    <rect width="210" height="6" fill="url(#accent2)" rx="3" />
    <text x="20" y="38" class="title-text">API Gateway</text>
    <text x="20" y="56" class="badge-text">Node.js + Express</text>
    <line x1="20" y1="68" x2="190" y2="68" stroke="#334155" stroke-width="1" />
    <text x="20" y="92" class="desc-text">• Dynamic Engine Router</text>
    <text x="20" y="112" class="desc-text">• JWT RBAC &amp; Tenant Auth</text>
    <text x="20" y="132" class="desc-text">• SSE Progress Streaming</text>
    <text x="20" y="152" class="desc-text">• Versioning &amp; Rollbacks</text>
    <text x="20" y="172" class="desc-text">• In-Memory Fallback Queue</text>
  </g>

  <!-- Node 3: Python Microservice -->
  <g transform="translate(670, 110)">
    <rect width="230" height="200" class="node-card" stroke="#10b981" />
    <rect width="230" height="6" fill="url(#accent2)" rx="3" />
    <text x="20" y="38" class="title-text">Industrial Solver</text>
    <text x="20" y="56" class="badge-text">Python 3.11 + FastAPI</text>
    <line x1="20" y1="68" x2="210" y2="68" stroke="#334155" stroke-width="1" />
    <text x="20" y="92" class="desc-text">• Google OR-Tools CP-SAT</text>
    <text x="20" y="112" class="desc-text">• Symmetry Breaking</text>
    <text x="20" y="132" class="desc-text">• Multi-Worker Parallelism</text>
    <text x="20" y="152" class="desc-text">• Hungarian Room Matching</text>
    <text x="20" y="172" class="desc-text">• DSATUR Feasibility Check</text>
  </g>

  <!-- Database & Redis Sub-cluster -->
  <g transform="translate(370, 360)">
    <rect width="210" height="85" class="node-card" stroke="#f59e0b" />
    <rect width="210" height="4" fill="url(#accent3)" rx="2" />
    <text x="20" y="28" class="title-text">Persistence &amp; Jobs</text>
    <text x="20" y="52" class="desc-text">PostgreSQL 16 (Prisma ORM)</text>
    <text x="20" y="70" class="desc-text">Redis 7 (BullMQ Job Queue)</text>
  </g>

  <!-- Legend / Flow Labels -->
  <rect x="290" y="175" width="70" height="20" rx="4" fill="#1e1b4b" stroke="#6366f1" stroke-width="1" />
  <text x="325" y="189" text-anchor="middle" font-family="'Fira Code', monospace" font-size="9" fill="#c7d2fe">JSON POST</text>

  <rect x="290" y="225" width="70" height="20" rx="4" fill="#064e3b" stroke="#10b981" stroke-width="1" />
  <text x="325" y="239" text-anchor="middle" font-family="'Fira Code', monospace" font-size="9" fill="#a7f3d0">SSE STREAM</text>

  <rect x="590" y="160" width="80" height="20" rx="4" fill="#0c4a6e" stroke="#38bdf8" stroke-width="1" />
  <text x="630" y="174" text-anchor="middle" font-family="'Fira Code', monospace" font-size="9" fill="#bae6fd">CP-SAT TASK</text>

  <rect x="590" y="210" width="80" height="20" rx="4" fill="#064e3b" stroke="#10b981" stroke-width="1" />
  <text x="630" y="224" text-anchor="middle" font-family="'Fira Code', monospace" font-size="9" fill="#a7f3d0">SOLUTION</text>
</svg>

